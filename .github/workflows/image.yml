# Container image publish — GitHub Actions -> Tencent TCR personal edition.
# Standard channel per openspec tcr-image-pipeline / docs/IMAGE-RELEASE.md.
# zhesi 参照系 MCP：测试门先行（诚实错误/provenance/空结果带原因是核心不变量），
# 测试不过不出片。
name: image

# 2026-11-21 **恢复自动出片**。原停用理由（2026-11-09 R2）是「本仓私有 + 组织
# Actions 额度耗尽」，出片转由公开镜像仓 scs001/fd-zhesi-reference-images 承担。
# 两个前提现在都不成立了：
#   ① 本仓已转公开 —— 公开仓 Actions 免费无限；
#   ② scs001/fd-zhesi-reference-images 在 2026-11-20 的 scs001 清理中已删除。
# 即：那个「承担出片的公开镜像仓」不存在了，而本仓现在是公开仓 —— 直接在这里出片
# 比维护一个派生快照仓更简单（openspec: one-repo-per-project）。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: hkccr.ccs.tencentyun.com
  NAMESPACE: finddata-business
  IMAGE_NAME: fd-zhesi-reference
  DOCKERFILE: Dockerfile

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test suite
        run: python -m pytest tests/ -q

  fd-zhesi-reference:
    needs: test
    uses: FindDataTechnology/fd-ci/.github/workflows/image-build.yml@main
    secrets: inherit
    with:
      image: fd-zhesi-reference
      namespace: finddata-business
